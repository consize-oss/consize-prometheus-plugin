name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true
      - name: Install checksum-pinned Prometheus test server
        run: bash scripts/ci/install-prometheus-test.sh "$RUNNER_TEMP/prometheus" >> "$GITHUB_ENV"
      - run: go mod download && go mod verify
      - run: go test -race -timeout 5m ./...
      - run: go vet ./...
      - name: Check generated configuration schema
        run: go run ./cmd/configschema -check
      - name: Check module files are tidy
        run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - name: Verify release packaging on all supported targets
        if: runner.os == 'Linux'
        run: |
          go run ./cmd/releasectl keygen -private-key "$RUNNER_TEMP/test-release.key" -public-key "$RUNNER_TEMP/test-release.pub"
          go run ./cmd/releasectl package -version 0.0.0-ci -private-key "$RUNNER_TEMP/test-release.key" -public-key "$RUNNER_TEMP/test-release.pub"
          go run ./cmd/releasectl verify -public-key "$RUNNER_TEMP/test-release.pub"
